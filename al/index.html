<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src blob:; connect-src https://*.supabase.co wss://*.supabase.co http://localhost:* ws://localhost:* http://127.0.0.1:* ws://127.0.0.1:*; base-uri 'none'; form-action 'none'" />
  <title>TDA Studio — Videoyu al</title>
  <link rel="stylesheet" href="al.css" />
</head>
<body>
  <main class="card">
    <div class="brand"><span class="logo">TDA</span> Studio</div>
    <h1 id="title">Video alınıyor</h1>
    <p id="msg" class="msg">Bilgisayara bağlanılıyor…</p>
    <div class="bar" id="bar" hidden><div id="fill"></div></div>
    <p id="detail" class="detail"></p>
    <video id="vid" controls playsinline hidden></video>
    <div class="actions" id="actions" hidden>
      <a id="save" class="btn primary" download>Videoyu kaydet</a>
      <button id="share" class="btn" type="button" hidden>Paylaş / Galeriye kaydet</button>
    </div>
    <p class="note" id="note">Video sunucuya yüklenmez: bilgisayarından doğrudan bu telefona, şifreli bağlantıyla gelir. Bu sayfayı aktarım bitene kadar açık tut.</p>
  </main>
  <script src="p2p-proto.js"></script>
  <script src="supabase.js"></script>
  <script src="al.js"></script>
</body>
</html>
